name: Build APK

on:
  push:
    branches: [main, "preview/v*-rc.*"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Versão
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/preview/v* ]]; then
            tag="${GITHUB_REF_NAME#preview/}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi
          # versionCode sempre crescente
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dashlive.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/dashlive.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/preview/v* ]]; then
            echo "::error::Segredos ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_PASSWORD não configurados; a atualização dentro do app não funcionaria."
            exit 1
          fi

      - name: Baixar modelo de detecção (EfficientDet-Lite0, Apache 2.0)
        # Precisa ser a versão da TFLite Task Library (com metadados e TFLite_Detection_PostProcess,
        # 4 saídas). A versão do MediaPipe tem só 2 saídas e o ObjectDetector recusa
        # ("Mobile SSD models are expected to have exactly 4 outputs, found 2").
        run: |
          mkdir -p app/src/main/assets
          F=app/src/main/assets/efficientdet_lite0.tflite
          for u in \
            "https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite0_detection_metadata_1.tflite" \
            "https://tfhub.dev/tensorflow/lite-model/efficientdet/lite0/detection/metadata/1?lite-format=tflite"; do
            curl -fL --retry 3 -o "$F" "$u" && [ "$(stat -c%s "$F")" -gt 2000000 ] \
              && grep -q TFLite_Detection_PostProcess "$F" && break
            rm -f "$F"
          done
          if [ ! -f "$F" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/preview/v* ]]; then
              echo "::error::Não foi possível baixar o modelo de detecção."
              exit 1
            fi
            echo "::warning::Modelo de detecção não baixado; a simulação ficará indisponível neste build."
          else
            ls -la "$F"
          fi

      - name: Build
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: >
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
          "-PappVersionName=$APP_VERSION_NAME"
          "-PappVersionCode=$APP_VERSION_CODE"

      - name: Nomear APK
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/DashLive-${RELEASE_TAG:-dev}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: DashLive-apk
          path: dist/*.apk

      - name: Publicar Release
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # Se a Release já foi criada pela página do GitHub, só anexa o APK
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            gh release create "$RELEASE_TAG" dist/*.apk --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "DashLive $RELEASE_TAG (teste)" --notes-file RELEASE_NOTES.md
          elif gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --title "DashLive $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md
          fi
